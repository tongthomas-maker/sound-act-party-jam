name: Sound It! source check

# Manual trigger only. No deploy, publish, signing or secrets.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Unit tests
        run: bun run test

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: iOS handoff fixture tests (synthetic, no builds or downloads)
        run: python3 docs/test-ios-handoff.py -v
